{% extends "base.html" %}

{% block content %}

<h1>Novo Post</h1>

<form method="POST" enctype="multipart/form-data">

    <input type="text" name="titulo" placeholder="Título"><br><br>

    <input type="text" name="categoria" placeholder="Categoria"><br><br>

    <textarea name="resumo" placeholder="Resumo"></textarea><br><br>

    <textarea name="conteudo" placeholder="Conteúdo"></textarea><br><br>

    <input type="file" name="imagem"><br><br>

    <button type="submit">Publicar</button>

</form>

{% endblock %}
