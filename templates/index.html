{% extends "base.html" %}

{% block content %}

<h1>Últimos Textos</h1>

<div class="container">

{% for p in posts %}

<div class="card">

    {% if p[5] %}
    <img src="{{ url_for('static', filename='uploads/' + p[5]) }}">
    {% endif %}

    <h3>{{ p[1] }}</h3>

    <small>{{ p[2] }}</small>

    <p>{{ p[3] }}</p>

    <a href="/post/{{ p[0] }}">Ler mais</a>

</div>

{% endfor %}

</div>

{% endblock %}
