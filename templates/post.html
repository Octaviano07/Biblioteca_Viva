{% extends "base.html" %}

{% block content %}

<div class="post-container">

    <h1>{{ post[1] }}</h1>
    <h4>{{ post[2] }}</h4>

    {% if post[5] %}
        <img src="{{ url_for('static', filename='uploads/' + post[5]) }}" width="300">
    {% endif %}

    <p>{{ post[4] }}</p>

    <a href="/" class="btn">Voltar</a>

</div>

{% endblock %}
