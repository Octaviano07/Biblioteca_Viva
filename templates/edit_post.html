{% extends "base.html" %}

{% block title %}Editar Post{% endblock %}

{% block content %}

<h1>Editar Post</h1>

<form method="POST" enctype="multipart/form-data">

    <input type="text" name="titulo" value="{{ post[1] }}" required>

    <input type="text" name="categoria" value="{{ post[2] }}" required>

    <textarea name="resumo" required>{{ post[3] }}</textarea>

    <textarea name="conteudo" required>{{ post[4] }}</textarea>

    <!-- IMAGEM ATUAL -->
    {% if post[5] %}
        <p>Imagem atual:</p>
        <img src="{{ url_for('static', filename='uploads/' + post[5]) }}" width="200">
    {% endif %}

    <!-- NOVA IMAGEM -->
    <input type="file" name="imagem">

    <button type="submit" class="btn">Guardar Alterações</button>

</form>

<a href="/admin" class="btn">Voltar</a>

{% endblock %}
